    <meta name="description" content="Repair broken copied text from ChatGPT, PDF, OCR, Markdown and Unicode instantly. Fast, free and privacy friendly." />
    
    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://textcase.in/" />
    <meta property="og:title" content="TextCase – Fix Broken Text Instantly" />
    <meta property="og:description" content="Repair broken copied text from ChatGPT, PDF, OCR, Markdown and Unicode instantly. Fast, free and privacy friendly." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="TextCase – Fix Broken Text Instantly" />
    <meta property="twitter:description" content="Repair broken copied text from ChatGPT, PDF, OCR, Markdown and Unicode instantly. Fast, free and privacy friendly." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- JSON-LD Structured Data Schemas -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TextCase",
      "operatingSystem": "All",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Repair broken copied text from ChatGPT, PDF, OCR, Markdown and Unicode instantly.",
      "browserRequirements": "Requires JavaScript. Requires HTML5."
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is broken text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Broken text is text containing layout and formatting artifacts such as incorrect line wraps, PDF copy hyphens, double spacing, smart quotes, mixed line endings, or hidden zero-width spaces."
          }
        },
        {
          "@type": "Question",
          "name": "Does text leave my device?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, TextCase runs 100% locally in your web browser. Your text is processed inside your local JavaScript engine and is never sent to any server."
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#fafafa] text-gray-900 font-sans antialiased">
